<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="60mm" viewBox="0 0 100 60">
  <!-- Two right triangles that together tile a square; they share the diagonal
       (50,10)-(10,50). The dedup should cut that diagonal once. -->
  <path d="M 10,10 L 50,10 L 10,50 Z" fill="none" stroke="#000000" stroke-width="0.5"/>
  <path d="M 50,10 L 50,50 L 10,50 Z" fill="none" stroke="#0000ff" stroke-width="0.5"/>
</svg>
