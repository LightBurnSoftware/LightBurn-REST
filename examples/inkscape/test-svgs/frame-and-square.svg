<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:lb="https://lightburnsoftware.com/inkscape"
     width="200mm" height="200mm" viewBox="0 0 200 200">
  <!-- A LightBurn workspace frame (100x100 user units) standing in for a
       200x200 mm machine, plus a 20x20 square near its top-left. -->
  <rect lb:role="workspace-frame" lb:product="lightburn" lb:workspace="200x200"
        x="0" y="0" width="100" height="100"
        style="fill:none;stroke:#d40000;stroke-dasharray:0.8,1.4"/>
  <rect x="10" y="10" width="20" height="20" style="fill:none;stroke:#000000"/>
</svg>
