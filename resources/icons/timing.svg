<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Timing belt pulley icon: circle with flat-topped teeth around rim -->
  <g fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="32" cy="32" r="12"/>
    <circle cx="32" cy="32" r="4"/>
    <!-- 8 flat-topped timing teeth around the rim -->
    <rect x="28" y="6"  width="8" height="8" rx="1"/>
    <rect x="28" y="50" width="8" height="8" rx="1"/>
    <rect x="6"  y="28" width="8" height="8" rx="1"/>
    <rect x="50" y="28" width="8" height="8" rx="1"/>
    <rect x="11" y="11" width="8" height="8" rx="1" transform="rotate(45 15 15)"/>
    <rect x="45" y="11" width="8" height="8" rx="1" transform="rotate(-45 49 15)"/>
    <rect x="11" y="45" width="8" height="8" rx="1" transform="rotate(-45 15 49)"/>
    <rect x="45" y="45" width="8" height="8" rx="1" transform="rotate(45 49 49)"/>
  </g>
</svg>
