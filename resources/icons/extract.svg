<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Extract profile icon: gear outline with outward arrow -->
  <g fill="none" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Simplified gear (left half) -->
    <circle cx="26" cy="32" r="12"/>
    <circle cx="26" cy="32" r="4.5"/>
    <rect x="22.5" y="7"  width="7" height="8" rx="1"/>
    <rect x="22.5" y="49" width="7" height="8" rx="1"/>
    <rect x="1"  y="28.5" width="8" height="7" rx="1"/>
  </g>
  <!-- Outward arrow (right side) -->
  <g fill="none" stroke="#2a7fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="38" y1="32" x2="58" y2="32"/>
    <polyline points="50,24 58,32 50,40"/>
  </g>
  <!-- Dashed selection box -->
  <rect x="14" y="20" width="24" height="24" rx="2"
        fill="none" stroke="#4a4a4a" stroke-width="1.5"
        stroke-dasharray="4,3" opacity="0.5"/>
</svg>
