openapi: 3.1.0
info:
  title: LightBurn / MillMage REST API
  version: 1.0.0
  description: |
    REST API for remote control of LightBurn and MillMage CNC/laser applications.
    Provides jog, homing, zero, go-to, spindle/aux control, job management,
    file upload, and real-time state streaming via SSE.

    ## Authentication

    All endpoints except `POST /api/bind`, `POST /api/connect`, and `GET /`
    require a Bearer token derived from a shared secret using HMAC-SHA256:

    ```
    token = hex(HMAC-SHA256(secret, floor(unix_time / 60)))
    ```

    The server accepts tokens for the current minute and the previous minute
    to handle clock drift.

    ## Obtaining a Secret

    There are two ways to obtain a shared secret:

    - **LAN pairing (`POST /api/bind`)**: For remote devices (e.g. pendants).
      Triggers a QR code in the application containing the server URL and secret.
      Disabled when the server is in local-only mode.
    - **Local application pairing (`POST /api/connect`)**: For localhost
      applications only. Sends an `application_name` in the request body. The
      application user is shown a consent dialog every time; if approved, a new
      secret is generated and returned. The dialog has a 30-second timeout
      after which the connection is automatically declined. Applications are
      responsible for persisting their own secret. Each call produces a
      distinct secret, even for the same `application_name`.

    ## Command Queuing

    Commands are processed through a priority queue system:
    - **Priority queue**: `job/stop`, `job/pause`, `job/start`, `jog/stop`,
      `spindle/toggle`, `aux/stop` — executed before any normal commands
    - **Normal queue**: all other commands — executed in FIFO order

servers:
  - url: https://localhost:8080
    description: Local server (default port)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: HMAC-SHA256 time-based token derived from shared secret

  schemas:
    OkResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Missing 'axis' parameter

    Position:
      type: object
      properties:
        machine:
          type: object
          properties:
            x: { type: number, example: 100.000 }
            y: { type: number, example: 50.000 }
            z: { type: number, example: -5.000 }
        workpiece:
          type: object
          properties:
            x: { type: number, example: 0.000 }
            y: { type: number, example: 0.000 }
            z: { type: number, example: -5.000 }

    ConnectionStatus:
      type: object
      properties:
        connected: { type: boolean }
        device_name: { type: string, example: Shapeoko 5 Pro }
        supports_z: { type: boolean }
        supports_overrides: { type: boolean }

    JogSettings:
      type: object
      properties:
        xy_distance: { type: number, example: 10.0 }
        z_distance: { type: number, example: 1.0 }
        xy_speed: { type: number, example: 1500.0 }
        z_speed: { type: number, example: 250.0 }
        units: { type: string, enum: [mm/s, mm/min, in/min] }

    SavedPosition:
      type: object
      properties:
        index: { type: integer }
        name: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        include_z: { type: boolean }
        workpiece: { type: boolean }

    JobState:
      type: object
      properties:
        state: { type: string, enum: [idle, running, paused] }
        progress: { type: number, minimum: 0, maximum: 100 }

    Overrides:
      type: object
      properties:
        speed_percent: { type: integer, example: 100 }
        power_percent: { type: integer, example: 100 }

    AuxState:
      type: object
      properties:
        spindle_on: { type: boolean }
        spindle_rpm: { type: integer }
        coolant_on: { type: boolean }
        vacuum_on: { type: boolean }

    PollSnapshot:
      type: object
      properties:
        position: { $ref: '#/components/schemas/Position' }
        job: { $ref: '#/components/schemas/JobState' }
        overrides: { $ref: '#/components/schemas/Overrides' }
        aux: { $ref: '#/components/schemas/AuxState' }
        connection: { $ref: '#/components/schemas/ConnectionStatus' }
        settings: { $ref: '#/components/schemas/JogSettings' }

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
    BadRequest:
      description: Invalid or missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /:
    get:
      summary: Placeholder HTML app
      security: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /api/bind:
    post:
      summary: Request LAN pairing QR code
      description: |
        Triggers the application to display a QR code containing the server URL
        and shared secret. No authentication required. If a secret already exists
        it is reused; calling bind again re-displays the same QR code.

        Returns 403 Forbidden when the server is running in local-only mode.
      security: []
      responses:
        '200':
          description: Bind request accepted, QR code displayed in app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: LAN-accessible API is disabled in local-only mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/connect:
    post:
      summary: Request localhost application pairing
      description: |
        Allows a local application to request a shared secret for API access.
        Only accepts connections from localhost (127.0.0.1 / ::1). The user is
        shown a consent dialog with the application name every time this
        endpoint is called. If they approve, a new shared secret is generated
        and returned. If they decline (or the 30-second timeout expires), the
        request is rejected with 403. Each approval produces a distinct secret;
        applications are responsible for persisting their own secret.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_name]
              properties:
                application_name:
                  type: string
                  description: Display name shown to the user in the consent dialog
                  example: My Automation Tool
      responses:
        '200':
          description: Connection approved, secret returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  secret:
                    type: string
                    description: Shared secret for deriving Bearer tokens
                    example: aB3dE7fG9hJ1kL5m
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Connection rejected by user, timed out, or not from localhost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/status:
    get:
      summary: Connection status
      responses:
        '200':
          description: Current connection state and device capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/position:
    get:
      summary: Current position snapshot
      responses:
        '200':
          description: Machine and workpiece coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jog:
    post:
      summary: Jog a discrete distance
      description: |
        Moves the machine a fixed distance in the specified direction.
        Continuous jogging is intentionally excluded for safety — network
        latency could prevent a timely stop signal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [axis]
              properties:
                axis:
                  type: string
                  enum: [x+, x-, y+, y-, z+, z-, x+y+, x-y+, x+y-, x-y-]
                distance:
                  type: number
                  description: Override jog distance (display units). Omit to use current setting.
                modifier:
                  type: string
                  enum: [none, ctrl, shift, ctrl+shift, alt]
                  default: none
                  description: Apply key multiplier to distance
      responses:
        '200':
          description: Jog command queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jog/stop:
    post:
      summary: Emergency stop (priority)
      description: Immediately stops all motion. Processed via the priority queue.
      responses:
        '200':
          description: Stop command queued (priority)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jog/settings:
    get:
      summary: Get jog distance and speed settings
      responses:
        '200':
          description: Current jog settings in display units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JogSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update jog settings
      description: Partial update — only provided fields are changed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                xy_distance: { type: number }
                z_distance: { type: number }
                xy_speed: { type: number }
                z_speed: { type: number }
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/home:
    post:
      summary: Home specified axes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                axes:
                  type: string
                  enum: [all, x, y, z]
                  default: all
      responses:
        '200':
          description: Home command queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/zero:
    post:
      summary: Zero workpiece origin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                axes:
                  type: string
                  enum: [all, x, y, z]
                  default: all
      responses:
        '200':
          description: Zero command queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/zero/edit:
    put:
      summary: Set workpiece origin coordinates
      description: Partial update — only provided axes are changed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
                z: { type: number }
      responses:
        '200':
          description: Workpiece origin updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/goto:
    post:
      summary: Move to absolute position
      description: Partial — only provided axes are moved.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number, nullable: true }
                y: { type: number, nullable: true }
                z: { type: number, nullable: true }
                origin:
                  type: string
                  enum: [workpiece, machine]
                  default: workpiece
      responses:
        '200':
          description: GoTo command queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/goto/saved:
    get:
      summary: List saved positions
      responses:
        '200':
          description: Array of saved positions from device profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedPosition'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/goto/saved/go:
    post:
      summary: Move to a saved position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: GoTo saved position queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/goto/saved/add:
    post:
      summary: Add a new saved position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                x: { type: number, default: 0 }
                y: { type: number, default: 0 }
                z: { type: number, default: 0 }
                include_z: { type: boolean, default: false }
                workpiece: { type: boolean, default: true }
      responses:
        '200':
          description: Position saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/spindle/toggle:
    post:
      summary: Toggle spindle on/off (priority)
      description: Processed via the priority queue.
      responses:
        '200':
          description: Spindle toggle queued (priority)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/spindle/speed:
    put:
      summary: Set spindle speed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rpm]
              properties:
                rpm:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Spindle speed updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coolant/toggle:
    post:
      summary: Toggle coolant on/off
      responses:
        '200':
          description: Coolant toggle queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/vacuum/toggle:
    post:
      summary: Toggle vacuum on/off
      responses:
        '200':
          description: Vacuum toggle queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/aux/stop:
    post:
      summary: Stop all aux outputs (priority)
      description: Turns off spindle, coolant, and vacuum. Processed via the priority queue.
      responses:
        '200':
          description: Aux stop queued (priority)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/override/speed:
    post:
      summary: Adjust feed rate override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [increment, decrement, increment_large, decrement_large, reset]
                  description: |
                    increment/decrement: +/-1%,
                    increment_large/decrement_large: +/-10%,
                    reset: back to 100%
      responses:
        '200':
          description: Override applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/override/power:
    post:
      summary: Adjust power/spindle speed override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [increment, decrement, increment_large, decrement_large, reset]
      responses:
        '200':
          description: Override applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/units:
    get:
      summary: Get current display units
      responses:
        '200':
          description: Current units
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: string
                    enum: [mm/s, mm/min, in/min]
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Set display units
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: string
                  enum: [mm/s, mm/min, in/min]
      responses:
        '200':
          description: Units changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/job/start:
    post:
      summary: Start the current job (priority)
      description: |
        Starts the loaded job. Ignored if already busy or no device connected.
        Processed via the priority queue.
      responses:
        '200':
          description: Start command queued (priority)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/job/pause:
    post:
      summary: Pause or resume the running job (priority)
      description: |
        Toggle behavior: pauses if running, resumes if paused. Ignored if idle.
        Processed via the priority queue.
      responses:
        '200':
          description: Pause/resume command queued (priority)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/job/stop:
    post:
      summary: Stop the running job (priority)
      description: |
        Stops the job and disables the spindle. Processed via the priority queue.
      responses:
        '200':
          description: Stop command queued (priority)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/file/upload:
    post:
      summary: Upload a file to import
      description: |
        Send the file as the raw request body. Include the filename in the
        `X-Filename` header. Returns 202 immediately; the import result is
        reported asynchronously via the `file_imported` SSE event.
      parameters:
        - name: X-Filename
          in: header
          schema:
            type: string
            default: upload.lbrn2
          description: Filename for the uploaded file
        - name: X-Group-Shapes
          in: header
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
          description: |
            When "true", imported shapes are kept as a group. When "false"
            (default), the application's global grouping preference applies.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: File received, import in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
                  filename: { type: string, example: design.svg }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events:
    get:
      summary: SSE event stream
      description: |
        Server-Sent Events stream for real-time state updates. Connect via
        `fetch()` with an `Authorization` header (the browser `EventSource`
        API does not support custom headers).

        ### Event types

        | Event | Frequency | Description |
        |-------|-----------|-------------|
        | `position` | ~2 Hz | Machine and workpiece coordinates |
        | `job` | ~2 Hz | Job state (idle/running/paused) and progress |
        | `settings` | On change | Jog distance, speed, units |
        | `overrides` | On change | Feed rate and power override percentages |
        | `aux` | On change | Spindle, coolant, vacuum state |
        | `connection` | On change | Device connected, name, capabilities |
        | `file_imported` | After upload | Import success/failure |

        A `:keepalive` comment is sent every 30 seconds.
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/poll:
    get:
      summary: Polling fallback
      description: |
        Returns the latest state snapshot as a single JSON object. Use this
        if SSE is unavailable.
      responses:
        '200':
          description: Complete state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
